; -------------------------------------------------
; Configuration PHP pour l'image docker : OSCAR dev
; -------------------------------------------------

; Fuseau horaire
date.timezone = Europe/Paris

; Durée d'un script (secondes)
max_execution_time = 60

; Utilisation de la mémoire
memory_limit = 1024M

; --- Envois de donnèes
; Taille max d'une requête POST
post_max_size = 25M
; Taille max d'UN fichier
upload_max_filesize = 10M



; Error
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
html_errors = On
log_errors = On
error_log = /var/log/php/oscar-error.log
