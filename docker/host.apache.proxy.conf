<VirtualHost *:80>
    # Le nom de domaine
    ServerName oscar-host-name

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # ProxyPASS
    ProxyPass / http://localhost:8888/
    ProxyPassReverse / http://localhost:8888/

    ErrorLog ${APACHE_LOG_DIR}/oscar-host-name_error.log
    CustomLog ${APACHE_LOG_DIR}/oscar-host-name_access.log combined
</VirtualHost>
