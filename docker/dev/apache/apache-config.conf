<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/application/public

    <Directory /var/application/public>
        AllowOverride All
        Require all granted
    </Directory>

#    SuexecUserGroup app www-data
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>