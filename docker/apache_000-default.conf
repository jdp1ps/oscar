<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/application/public

    <Directory "/var/application/public">
            AllowOverride All
            Require all granted
            DirectoryIndex index.php
            <FilesMatch \.php$>
                SetHandler "proxy:fcgi://app-php:9000"
            </FilesMatch>
        </Directory>
    LogLevel debug
    ErrorLog /proc/self/fd/2
</VirtualHost>